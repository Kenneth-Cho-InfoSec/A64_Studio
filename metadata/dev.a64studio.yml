AutoName: A64 Studio
Summary: Native ARM64 assembly IDE
Description: |
  A64 Studio is an offline AArch64 assembly IDE for Android. It assembles
  source locally and runs the machine code on the device's real ARM64 CPU in
  an isolated worker process with a watchdog. Inspect registers, flags, machine
  code, memory and disassembly without a server, emulator, root or Termux.

  The editor includes syntax highlighting, line numbers, folding,
  find/replace, undo/redo, autocomplete, signature hints, a minimap, error
  underlines, label highlighting and a custom key row. Additional screens
  provide an instruction explorer, raw hex patcher, benchmarks, projects, CPU
  feature inspection and theme/token-colour settings.

  A64 Studio never emulates ARM. On x86 devices execution reports an explicit
  unsupported message. Guest x30 is the host return address, self-modifying
  code is not supported because Android enforces W^X, and the worker is
  process isolation rather than a security sandbox. The assembler implements
  270 verified encodings, not the complete GNU assembler, and there is no
  debugger, linker, libc, thread runtime or SIMD register inspector.

  The app requests no INTERNET permission and contains no tracking or network
  code.
