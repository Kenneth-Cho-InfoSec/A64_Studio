[package]
name = "a64core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MPL-2.0"
description = "AArch64 assembler, disassembler and native execution core for A64 Studio"
repository = "https://github.com/a64studio/a64studio"

[lib]
name = "a64core"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaxpeax-arm = "0.3"
yaxpeax-arch = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "unwind"
